
name: CI - Tests Node.js

on:
    # Ejecutar el flujo de trabajo en cada push a la rama develop y en cada pull request hacia la rama main
  push:
    branches:
      - develop
  pull_request:
    # Ejecutar el flujo de trabajo en cada pull request hacia la rama main
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test
